spring.application.name=skye-personal-finance-manager

# H2 in-memory database (assignment-friendly, zero local DB setup)
spring.datasource.url=jdbc:h2:mem:skye_finance;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# API base path: http://localhost:8080/api
server.port=${PORT:8080}
server.servlet.context-path=/api

# Session cookie auth (required by assignment grading script)
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=FINANCE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax

logging.level.com.example.skye=INFO
logging.level.org.springframework.security=WARN
